services:
  - type: web
    name: packagepulse-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @packagepulse/api db:generate && pnpm --filter @packagepulse/api db:migrate && pnpm --filter @packagepulse/api build
    startCommand: pnpm --filter @packagepulse/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: packagepulse-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONITOR_INTERVAL_MS
        value: "21600000"

  - type: web
    name: packagepulse-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @packagepulse/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: packagepulse-api
          envVarKey: RENDER_EXTERNAL_URL
